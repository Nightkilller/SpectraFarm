[project]
name = "agriN"
version = "0.1.0"
description = "AgriN — AI-Powered Smart Crop Intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    {name = "Aditya Gupta"},
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
dashboard = [
    "streamlit>=1.30",
    "streamlit-folium>=0.15",
    "folium>=0.15",
    "plotly>=5.0",
    "pandas>=2.0",
    "numpy>=1.24",
]
satellite = [
    "earthengine-api>=0.1.380",
    "geemap>=0.30",
]
ml = [
    "scikit-learn>=1.3",
]
ai = [
    "google-generativeai>=0.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
