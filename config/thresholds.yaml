# =============================================================================
# AgriN — Vegetation & Stress Thresholds (UNCALIBRATED / PLACEHOLDERS)
# =============================================================================
# STATUS: UNCALIBRATED / PLACEHOLDER
# NOTE: These values are initial literature placeholders. They have NOT been
# calibrated or validated against ground truth in Sehore or any pilot region.
# Production stress classification is guarded and DISABLED until reference
# observations and calibration are available.
# =============================================================================

calibration_status:
  is_calibrated: false
  calibrated_at: null
  calibration_notes: "Unvalidated literature placeholders. Production stress classification disabled."

# NDVI health interpretation (Uncalibrated placeholders)
ndvi:
  bare_soil_max: 0.15
  sparse_vegetation_max: 0.3
  moderate_vegetation_max: 0.5
  dense_vegetation_min: 0.5
  trend_threshold: 0.05

# NDWI thresholds (Uncalibrated placeholders)
ndwi:
  water_stress_threshold: 0.0
  adequate_moisture_min: 0.1

# Moisture / crop stress classification (Uncalibrated placeholders)
stress:
  calibrated: false
  healthy_min: 0.7
  mild_min: 0.5
  moderate_min: 0.3

# SAR-based moisture indicator (Uncalibrated placeholders)
sar:
  calibrated: false
  dry_threshold: -14.0
  wet_threshold: -8.0
