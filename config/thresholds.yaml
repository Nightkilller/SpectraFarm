# =============================================================================
# SpectraFarm — Vegetation & Stress Thresholds (Calibrated for Indo-Gangetic Plains)
# =============================================================================
# STATUS: CALIBRATED (Uttar Pradesh & Bihar Multi-Sensor Baseline)
# Calibrated against Sentinel-2 Optical (NDVI, NDWI) and Sentinel-1 SAR backscatter
# =============================================================================

calibration_status:
  is_calibrated: true
  calibrated_at: "2026-08-28"
  calibration_region: "Indo-Gangetic Plain (Uttar Pradesh / Bihar)"
  calibration_notes: "Calibrated multi-temporal optical-SAR moisture stress index for Rabi and Kharif crop cycles."

# NDVI health interpretation (Indo-Gangetic Agro-climatic zone)
ndvi:
  bare_soil_max: 0.18
  sparse_vegetation_max: 0.35
  moderate_vegetation_max: 0.55
  dense_vegetation_min: 0.55
  trend_threshold: 0.03

# NDWI canopy moisture thresholds (Gao / McFeeters normalized index)
ndwi:
  water_stress_threshold: -0.15
  adequate_moisture_min: 0.05

# Multi-Sensor Moisture / Crop Stress Classification
stress:
  calibrated: true
  healthy_min: 0.65
  mild_min: 0.45
  moderate_min: 0.28

# Sentinel-1 SAR Radar Moisture / Roughness baseline
sar:
  calibrated: true
  dry_threshold: -14.5
  wet_threshold: -8.5
