# =============================================================================
# AgriN — Application Settings
# =============================================================================

app:
  name: "AgriN"
  version: "0.1.0"
  description: "AI-Powered Smart Crop Intelligence"
  mode: "live"  # "demo" or "live" — overridden by AGRIN_MODE env var

# Pilot region: Sehore, Madhya Pradesh, India
# Uses a small test AOI around the pilot site for satellite demonstration.
pilot_region:
  name: "Sehore Pilot Test AOI"
  district: "Sehore"
  state: "Madhya Pradesh"
  country: "India"
  center_lat: 23.2000
  center_lon: 77.0800
  buffer_meters: 2000
  # Approximate AOI bounding box for tests (~4km x 4km box)
  bbox:
    min_lat: 23.1800
    max_lat: 23.2200
    min_lon: 77.0600
    max_lon: 77.1000

# Public ML Reference Region (Primary: Uttar Pradesh)
# Used for public-data ML experimentation and crop classification model training
ml_reference_region:
  name: "Uttar Pradesh Public ML Benchmark Region"
  state: "Uttar Pradesh"
  country: "India"
  dataset: "agrifieldnet"
  dataset_name: "AgriFieldNet Competition Dataset"
  doi: "10.34911/rdnt.wu92p1"
  source_url: "https://source.coop/radiantearth/agrifieldnet-competition"
  license: "CC-BY-4.0"

# Public ML Reference Region (Secondary: Bihar)
secondary_ml_reference_region:
  name: "Bihar Public ML Benchmark Region"
  state: "Bihar"
  country: "India"
  dataset: "agrifieldnet"
  dataset_name: "AgriFieldNet Competition Dataset"
  doi: "10.34911/rdnt.wu92p1"
  source_url: "https://source.coop/radiantearth/agrifieldnet-competition"
  license: "CC-BY-4.0"

# Satellite configuration
satellite:
  sentinel2:
    collection: "COPERNICUS/S2_SR_HARMONIZED"
    cloud_cover_max: 20  # percent
    bands:
      - "B2"   # Blue (490 nm)
      - "B3"   # Green (560 nm)
      - "B4"   # Red (665 nm)
      - "B8"   # NIR (842 nm)
      - "B11"  # SWIR1 (1610 nm)
      - "B12"  # SWIR2 (2190 nm)
  sentinel1:
    collection: "COPERNICUS/S1_GRD"
    orbit: "DESCENDING"
    polarizations:
      - "VV"
      - "VH"

# Date range for satellite retrieval
date_range:
  lookback_months: 3

# Languages supported
languages:
  - code: "en"
    name: "English"
  - code: "hi"
    name: "हिन्दी"

default_language: "en"
