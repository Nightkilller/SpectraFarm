    label: "Wheat"
    label_hi: "गेहूँ"
    color: "#eab308"
    class_index: 9
    season: "rabi"

  - id: "rice"
    label: "Rice"
    label_hi: "चावल"
    color: "#15803d"
    class_index: 6
    season: "kharif"

  - id: "soybean"
    label: "Soybean"
    label_hi: "सोयाबीन"
    color: "#059669"
